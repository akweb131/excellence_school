<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Excellence English School</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        /* Special styles just for the login page background */
        .login-page-bg {
            background: linear-gradient(135deg, rgba(0, 31, 63, 0.9) 0%, rgba(0, 51, 102, 0.9) 100%), url('https://via.placeholder.com/1920x1080/003366/003366');
            background-size: cover;
            background-position: center;
            min-height: 100vh;
            display: flex;
            align-items: center;
        }
        .nav-pills .nav-link {
            color: var(--text-dark);
            border-radius: 8px;
            font-weight: 600;
        }
        .nav-pills .nav-link.active {
            background-color: var(--primary-blue);
            color: var(--white);
        }
        .login-card {
            border-top: 5px solid var(--accent-gold);
        }
    </style>
</head>
<body class="login-page-bg">

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-5 col-md-8 col-sm-10" data-aos="zoom-in">
                
                <!-- School Logo/Name -->
                <div class="text-center mb-4">
                    <a href="index.html" class="text-decoration-none text-white">
                        <h2 class="fw-bold mb-0">EXCELLENCE</h2>
                        <span class="text-gold tracking-wide fw-bold text-uppercase" style="font-size: 0.9rem;">English School</span>
                    </a>
                </div>

                <!-- Login Card -->
                <div class="card login-card shadow-lg border-0 rounded-4 p-4 p-md-5 bg-white">
                    
                    <!-- Tabs for Student vs Admin -->
                    <ul class="nav nav-pills nav-justified mb-4" id="loginTabs" role="tablist">
                        <li class="nav-item" role="presentation">
                            <button class="nav-link active" id="student-tab" data-bs-toggle="pill" data-bs-target="#student-login" type="button" role="tab">Student</button>
                        </li>
                	        <li class="nav-item" role="presentation">
                            <button class="nav-link" id="admin-tab" data-bs-toggle="pill" data-bs-target="#admin-login" type="button" role="tab">Admin</button>
                        </li>
                    </ul>

                    <div class="tab-content" id="loginTabsContent">
                        
                        <!-- Student Login Form -->
                        <!-- Student Login Form -->
                        <div class="tab-pane fade show active" id="student-login" role="tabpanel">
                            <div class="text-center mb-4">
                                <h4 class="fw-bold text-primary-blue">Welcome Back!</h4>
                                <p class="text-muted small">Demo Credentials -> ID: <b>STU2026</b> | Pass: <b>student123</b></p>
                            </div>
                            <!-- Added ID to form -->
                            <form id="studentLoginForm">
                                <div class="mb-3">
                                    <label class="form-label text-muted fw-semibold small">Enrollment ID</label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-light border-end-0"><i class="fas fa-user text-muted"></i></span>
                                        <input type="text" id="studentId" class="form-control custom-input border-start-0 ps-0" placeholder="Enter STU2026" required>
                                    </div>
                                </div>
                                <div class="mb-4">
                                    <label class="form-label text-muted fw-semibold small d-flex justify-content-between">
                                        Password
                                        <a href="#" class="text-gold text-decoration-none">Forgot?</a>
                                    </label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-light border-end-0"><i class="fas fa-lock text-muted"></i></span>
                                        <input type="password" id="studentPass" class="form-control custom-input border-start-0 ps-0" placeholder="Enter student123" required>
                                    </div>
                                </div>
                                <!-- Error Message Container -->
                                <div id="studentError" class="text-danger small fw-bold text-center mb-3 d-none">Invalid ID or Password!</div>
                                
                                <button type="submit" class="btn btn-primary-custom w-100 py-2 fw-bold rounded-3">Login as Student</button>
                            </form>
                        </div>

                        <!-- Admin Login Form -->
                        <div class="tab-pane fade" id="admin-login" role="tabpanel">
                            <div class="text-center mb-4">
                                <h4 class="fw-bold text-primary-blue">Admin Portal</h4>
                                <p class="text-muted small">Demo Credentials -> User: <b>admin</b> | Pass: <b>admin123</b></p>
                            </div>
                            <!-- Added ID to form -->
                            <form id="adminLoginForm">
                                <div class="mb-3">
                                    <label class="form-label text-muted fw-semibold small">Admin Username</label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-light border-end-0"><i class="fas fa-shield-alt text-muted"></i></span>
                                        <input type="text" id="adminUser" class="form-control custom-input border-start-0 ps-0" placeholder="Enter admin" required>
                                    </div>
                                </div>
                                <div class="mb-4">
                                    <label class="form-label text-muted fw-semibold small">Admin Password</label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-light border-end-0"><i class="fas fa-key text-muted"></i></span>
                                        <input type="password" id="adminPass" class="form-control custom-input border-start-0 ps-0" placeholder="Enter admin123" required>
                                    </div>
                                </div>
                                <!-- Error Message Container -->
                                <div id="adminError" class="text-danger small fw-bold text-center mb-3 d-none">Invalid Username or Password!</div>

                                <button type="submit" class="btn btn-primary w-100 py-2 fw-bold rounded-3 bg-primary-blue border-0">Secure Admin Login</button>
                            </form>
                        </div>

                    </div>
                </div>
                
                <div class="text-center mt-4">
                    <a href="index.html" class="text-white-50 text-decoration-none"><i class="fas fa-arrow-left me-2"></i>Back to Home</a>
                </div>

            </div>
        </div>
    </div>
<script>
        // Student Login Logic
        document.getElementById('studentLoginForm').addEventListener('submit', function(e) {
            e.preventDefault(); // Stop page reload
            const id = document.getElementById('studentId').value;
            const pass = document.getElementById('studentPass').value;
            
            if (id === 'STU2026' && pass === 'student123') {
                window.location.href = 'student-dashboard.html'; // Redirect on success
            } else {
                document.getElementById('studentError').classList.remove('d-none'); // Show error
            }
        });

        // Admin Login Logic
        document.getElementById('adminLoginForm').addEventListener('submit', function(e) {
            e.preventDefault(); // Stop page reload
            const user = document.getElementById('adminUser').value;
            const pass = document.getElementById('adminPass').value;
            
            if (user === 'admin' && pass === 'admin123') {
                window.location.href = 'admin-dashboard.html'; // Redirect on success
            } else {
                document.getElementById('adminError').classList.remove('d-none'); // Show error
            }
        });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>AOS.init({ duration: 800, once: true });</script>
</body>
</html>
